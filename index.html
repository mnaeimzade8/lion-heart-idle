    <style>
        :root {
            --bg-dark: #0b0d14;
            --panel-bg: #151926;
            --panel-border: #262d42;
            --gold: #f59e0b;
            --hero-green: #10b981;
            --enemy-red: #ef4444;
            --crit-orange: #ff5500;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100%;
            width: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body {
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 8px 12px;
            border-radius: 12px;
            flex-shrink: 0;
        }
        .player-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

            font-size: 11px;
            color: var(--text-dim);
            font-weight: 600;
